# FrameCast — XcodeGen project spec
# 1. Change APP_BUNDLE_ID below to your own reverse-DNS id (e.g. com.yourcompany.FrameCast)
# 2. Put your Apple Developer Team ID in DEVELOPMENT_TEAM (needed for the virtual camera)
# 3. Run ./bootstrap.sh  (or: xcodegen generate)

name: FrameCast
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    APP_BUNDLE_ID: com.example.FrameCast
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  FrameCast:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: FrameCast
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSCameraUsageDescription: FrameCast captures the screen of iPhones and iPads connected over USB.
        NSMicrophoneUsageDescription: FrameCast can record microphone narration alongside your device capture.
        NSSystemExtensionUsageDescription: Installs the FrameCast virtual camera so Zoom, Teams and Meet can show your framed device.
    entitlements:
      path: Sources/App/FrameCast.entitlements
      properties:
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        com.apple.developer.system-extension.install: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)$(APP_BUNDLE_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: FrameCast
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - target: FrameCastCamera
        embed: false
    postBuildScripts:
      - name: Embed Camera Extension
        basedOnDependencyAnalysis: false
        script: |
          set -e
          EXT_NAME="${APP_BUNDLE_ID}.CameraExtension.systemextension"
          SRC="${BUILT_PRODUCTS_DIR}/${EXT_NAME}"
          DEST="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Library/SystemExtensions"
          if [ -d "$SRC" ]; then
            mkdir -p "$DEST"
            rm -rf "$DEST/${EXT_NAME}"
            ditto "$SRC" "$DEST/${EXT_NAME}"
          else
            echo "warning: camera extension not found at $SRC"
          fi

  FrameCastCamera:
    type: system-extension
    platform: macOS
    sources:
      - path: Sources/CameraExtension
    info:
      path: Sources/CameraExtension/Info.plist
      properties:
        CFBundleDisplayName: FrameCast Camera
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSSystemExtensionUsageDescription: Provides the FrameCast virtual camera.
        CMIOExtension:
          CMIOExtensionMachServiceName: $(TeamIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
    entitlements:
      path: Sources/CameraExtension/CameraExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)$(APP_BUNDLE_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).CameraExtension
        PRODUCT_NAME: $(APP_BUNDLE_ID).CameraExtension
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
